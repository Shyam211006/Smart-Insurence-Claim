<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify Email - SmartClaim AI</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">🛡️ SmartClaim AI</div>
    <div class="nav-links">
      <button id="themeToggleBtn" class="theme-toggle">🌙 Dark Mode</button>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <div class="center-page">
    <div class="card auth-card">
      <h2 style="margin-bottom: 10px; color: var(--primary-dark);">Verify Your Gmail</h2>
      <p style="color: var(--gray); font-size: 14px; margin-bottom: 20px;">
        We've sent a 6-digit code to <strong id="emailDisplay">your email</strong>.
        Enter it below to activate your account.
      </p>

      <form id="verifyForm">
        <div class="form-group">
          <label for="otp">Verification Code</label>
          <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit code"
            maxlength="6"
            inputmode="numeric"
            pattern="[0-9]{6}"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Verify & Continue</button>
      </form>

      <p class="form-footer-text">
        Didn't get a code? <a href="#" id="resendLink">Resend it</a>
      </p>
    </div>
  </div>

  <div id="spinner" class="spinner-overlay hidden">
    <div class="spinner"></div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/verify-otp.js"></script>
</body>
</html>
