<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register - SmartClaim AI</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">🛡️ SmartClaim AI</div>
    <div class="nav-links">
      <button id="themeToggleBtn" class="theme-toggle">🌙 Dark Mode</button>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <div class="center-page">
    <div class="card auth-card">
      <h2 style="margin-bottom: 20px; color: var(--primary-dark);">Create an Account</h2>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label for="email">Gmail Address</label>
          <input type="email" id="email" placeholder="yourname@gmail.com" required />
          <small id="emailHint" style="display:block; margin-top:4px; color: var(--gray); font-size:12px;">
            Only a valid @gmail.com address is accepted.
          </small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required />
            <button type="button" class="password-toggle-btn" id="togglePassword">Show</button>
          </div>
        </div>

        <div class="form-group">
          <label for="role">Account Type</label>
          <select id="role">
            <option value="customer">Customer</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Register</button>
      </form>

      <p class="form-footer-text">Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </div>

  <div id="spinner" class="spinner-overlay hidden">
    <div class="spinner"></div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
