<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - SmartClaim AI</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">🛡️ SmartClaim AI</div>
    <div class="nav-links">
      <button id="themeToggleBtn" class="theme-toggle">🌙 Dark Mode</button>
      <a href="index.html">Home</a>
      <a href="register.html">Register</a>
    </div>
  </nav>

  <div class="center-page">
    <div class="card auth-card">
      <h2 style="margin-bottom: 20px; color: var(--primary-dark);">Welcome Back</h2>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Your password" required />
            <button type="button" class="password-toggle-btn" id="togglePassword">Show</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>

      <p class="form-footer-text">Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </div>

  <div id="spinner" class="spinner-overlay hidden">
    <div class="spinner"></div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
